<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1"
  >

  <title>IDC Garba Raasverse 2026 Scanner</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      text-align: center;

      background:
        radial-gradient(
          circle at top,
          #762467 0%,
          #3b1245 42%,
          #17091e 100%
        );
    }

    .screen {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }

    .hidden {
      display: none !important;
    }

    .diya {
      font-size: 55px;
      margin-bottom: 15px;
    }

    .present {
      color: #f3d78a;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 3px;
      margin-bottom: 18px;
    }

    .title {
      margin: 0;
      color: #fff4cf;
      font-size: 39px;
      line-height: 1.05;
      font-weight: 900;
    }

    .year {
      color: #e9b84e;
      font-size: 31px;
      font-weight: 900;
      margin-top: 7px;
    }

    .tagline {
      color: #efdcb4;
      font-size: 15px;
      letter-spacing: 1px;
      margin-top: 18px;
    }

    .line {
      width: 90px;
      height: 2px;
      margin: 30px auto;
      background: #d7aa4d;
    }

    .button {
      width: 100%;
      max-width: 340px;
      min-height: 60px;
      border: 0;
      border-radius: 40px;

      background:
        linear-gradient(
          135deg,
          #f8db7e,
          #d69a30
        );

      color: #32103b;
      font-size: 19px;
      font-weight: 900;
      letter-spacing: 1px;
      cursor: pointer;

      box-shadow:
        0 10px 30px
        rgba(0, 0, 0, .30);
    }

    .button:active {
      transform: scale(.98);
    }

    .date {
      margin-top: 28px;
      color: #d7c4d5;
      font-size: 13px;
    }

    .scanner-title {
      color: #f3d78a;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .scanner-heading {
      color: #fff4cf;
      font-size: 27px;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .instruction {
      color: #dac8d8;
      font-size: 14px;
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      max-width: 420px;
      border-radius: 24px;
      overflow: hidden;
      background: black;
    }

    #reader video {
      border-radius: 24px;
    }

    .scanning {
      margin-top: 18px;
      color: #f3d78a;
      font-size: 14px;
    }

    .verifying {
      margin-top: 22px;
      color: #f4d783;
      font-size: 19px;
      font-weight: bold;
    }

    .error {
      width: 100%;
      max-width: 400px;
      margin-top: 20px;
      padding: 15px;
      border-radius: 15px;
      background: rgba(255, 90, 90, .15);
      color: #ffaaaa;
      font-size: 14px;
      line-height: 1.5;
    }

    .cancel {
      margin-top: 24px;
      border: 1px solid rgba(255, 255, 255, .35);
      border-radius: 30px;
      padding: 12px 25px;
      background: transparent;
      color: white;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>


<body>

  <!-- WELCOME SCREEN -->

  <div
    id="welcomeScreen"
    class="screen"
  >

    <div class="diya">
      🪔
    </div>

    <div class="present">
      INDIAN DANCE CREW PRESENTS
    </div>

    <h1 class="title">
      IDC GARBA
      <br>
      RAASVERSE
    </h1>

    <div class="year">
      2026
    </div>

    <div class="tagline">
      ENTER THE WORLD OF GARBA
    </div>

    <div class="line"></div>

    <button
      id="scanButton"
      class="button"
      type="button"
    >
      SCAN PASS
    </button>

    <div class="date">
      11 OCTOBER 2026 • TOKYO
    </div>

  </div>


  <!-- SCANNER SCREEN -->

  <div
    id="scannerScreen"
    class="screen hidden"
  >

    <div class="scanner-title">
      IDC GARBA RAASVERSE 2026
    </div>

    <div class="scanner-heading">
      SCAN ENTRY PASS
    </div>

    <div class="instruction">
      Place the participant's QR code inside the frame
    </div>

    <div id="reader"></div>

    <div
      id="scanningMessage"
      class="scanning"
    >
      Looking for QR code...
    </div>

    <div
      id="verifyMessage"
      class="verifying hidden"
    >
      ✨ Verifying pass...
    </div>

    <div
      id="cameraError"
      class="error hidden"
    ></div>

    <button
      id="cancelButton"
      class="cancel"
      type="button"
    >
      CANCEL
    </button>

  </div>


  <!-- QR SCANNER LIBRARY -->

  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
  </script>


  <script>

    /*
     * ==========================================
     * APPS SCRIPT BACKEND
     * ==========================================
     *
     * We will replace this with your real
     * Apps Script /exec URL.
     */

    const APPS_SCRIPT_URL =
      'https://script.google.com/macros/s/AKfycbzKpcjtDtmo75CPtmWKxTkSQkw-gWdKc7fAlBUR8ru6lYBxh3MPBKknnTBJl9CKACtA/exec';


    let scanner = null;
    let scanLocked = false;


    const welcomeScreen =
      document.getElementById('welcomeScreen');

    const scannerScreen =
      document.getElementById('scannerScreen');

    const scanButton =
      document.getElementById('scanButton');

    const cancelButton =
      document.getElementById('cancelButton');

    const cameraError =
      document.getElementById('cameraError');

    const scanningMessage =
      document.getElementById('scanningMessage');

    const verifyMessage =
      document.getElementById('verifyMessage');


    scanButton.addEventListener(
      'click',
      startScanner
    );


    cancelButton.addEventListener(
      'click',
      async function() {

        await stopScanner();

        scannerScreen
          .classList
          .add('hidden');

        welcomeScreen
          .classList
          .remove('hidden');

      }
    );


    /*
     * ==========================================
     * START CAMERA
     * ==========================================
     */

    async function startScanner() {

      scanLocked = false;

      cameraError
        .classList
        .add('hidden');

      verifyMessage
        .classList
        .add('hidden');

      scanningMessage
        .classList
        .remove('hidden');

      welcomeScreen
        .classList
        .add('hidden');

      scannerScreen
        .classList
        .remove('hidden');


      try {

        if (
          typeof Html5Qrcode ===
          'undefined'
        ) {

          throw new Error(
            'QR scanner library did not load.'
          );

        }


        scanner =
          new Html5Qrcode(
            'reader'
          );


        const cameras =
          await Html5Qrcode
            .getCameras();


        if (
          !cameras ||
          cameras.length === 0
        ) {

          throw new Error(
            'No camera found.'
          );

        }


        let selectedCamera =
          cameras[0].id;


        /*
         * Prefer rear camera on phone.
         */

        for (
          let i = 0;
          i < cameras.length;
          i++
        ) {

          const label =
            String(
              cameras[i].label || ''
            )
            .toLowerCase();


          if (
            label.includes('back') ||
            label.includes('rear') ||
            label.includes('environment')
          ) {

            selectedCamera =
              cameras[i].id;

            break;

          }

        }


        const config = {

          fps: 10,

          qrbox: function(
            viewfinderWidth,
            viewfinderHeight
          ) {

            const size =
              Math.floor(
                Math.min(
                  viewfinderWidth,
                  viewfinderHeight
                ) * 0.72
              );


            return {
              width: size,
              height: size
            };

          }

        };


        await scanner.start(

          selectedCamera,

          config,

          onScanSuccess,

          function() {
            // Ignore normal scan failures.
          }

        );

      }
      catch (error) {

        console.error(
          'CAMERA ERROR:',
          error
        );

        scanningMessage
          .classList
          .add('hidden');

        cameraError
          .textContent =
          'Camera could not be opened. Please allow camera access and try again.';

        cameraError
          .classList
          .remove('hidden');

      }

    }


    /*
     * ==========================================
     * QR SUCCESS
     * ==========================================
     */

    async function onScanSuccess(
      decodedText
    ) {

      if (scanLocked) {
        return;
      }


      scanLocked = true;


      const qrValue =
        String(
          decodedText || ''
        )
        .trim();


      /*
       * Only accept IDC 2026 passes.
       */

      if (
        !qrValue.startsWith(
          'IDC2026|'
        )
      ) {

        cameraError
          .textContent =
          '⚠️ This is not an IDC Garba Raasverse 2026 entry pass.';

        cameraError
          .classList
          .remove('hidden');

        scanLocked = false;

        return;

      }


      scanningMessage
        .classList
        .add('hidden');

      verifyMessage
        .classList
        .remove('hidden');


      await stopScanner();


      /*
       * Send the QR value to Apps Script.
       *
       * Apps Script then checks:
       *
       * Ticket ID
       * Participant name
       * Check-in status
       * Duplicate entry
       */

      const destination =
        APPS_SCRIPT_URL +
        '?qr=' +
        encodeURIComponent(
          qrValue
        );


      window.location.href =
        destination;

    }


    /*
     * ==========================================
     * STOP CAMERA
     * ==========================================
     */

    async function stopScanner() {

      if (!scanner) {
        return;
      }


      try {

        await scanner.stop();

      }
      catch (error) {

        console.log(
          'Scanner stop:',
          error
        );

      }


      try {

        scanner.clear();

      }
      catch (error) {

        console.log(
          'Scanner clear:',
          error
        );

      }


      scanner = null;

    }


    /*
     * ==========================================
     * WHEN USER RETURNS TO SCANNER
     * ==========================================
     */

window.addEventListener(
  'pageshow',
  async function() {

    // Reset scanner lock
    scanLocked = false;


    // Hide verifying message
    verifyMessage
      .classList
      .add('hidden');


    // Hide any old camera error
    cameraError
      .classList
      .add('hidden');


    // Show normal scanning message again
    scanningMessage
      .classList
      .remove('hidden');


    // Make sure old scanner is stopped
    if (scanner) {

      try {
        await stopScanner();
      }
      catch (error) {
        console.log(error);
      }

    }


    // Return to welcome screen
    scannerScreen
      .classList
      .add('hidden');


    welcomeScreen
      .classList
      .remove('hidden');

  }
);

  </script>

</body>

</html>
