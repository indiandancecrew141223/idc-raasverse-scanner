<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1"
  >

  <title>
    IDC RAASVERSE 2.0 — Sharad Purnima Scanner
  </title>


  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --gold:#f1ca70; --cream:#fff3d2; }
    .title,.scanner-heading,.year,.present,.scanner-title {font-family:'Cinzel',Georgia,serif;}
    body {font-family:'DM Sans',Arial,sans-serif !important;}
    #idcResultPanel {position:relative;overflow:hidden;width:100%;max-width:440px;margin:24px auto 12px;padding:26px 18px 23px;border:2px solid #eac36a;border-radius:23px;background:radial-gradient(circle at 50% -25%,#62366c 0%,#291432 62%,#160c24 100%);box-shadow:0 16px 40px #0006, inset 0 0 0 4px #f6d58c13;text-align:center;color:var(--cream);}
    #idcResultPanel:before,#idcResultPanel:after {content:'✦ ❋ ✦';display:block;color:#e8b85d;letter-spacing:12px;font-size:17px;margin-bottom:13px;}
    #idcResultPanel:after {margin:17px 0 0;}
    .idc-result-kicker {font-family:'Cinzel',Georgia,serif;font-size:11px;letter-spacing:2px;color:#eac36a;font-weight:700;}
    .idc-result-icon {font-size:42px;margin:8px 0 3px;}
    .idc-result-title {font-family:'Cinzel',Georgia,serif;font-size:clamp(20px,5vw,28px);font-weight:800;line-height:1.25;color:#ffdf8e;margin:8px 0 12px;}
    .idc-result-message {font-size:15px;line-height:1.65;color:#fff1df;margin:10px 0;}
    .idc-result-name {font-family:'Cinzel',Georgia,serif;color:#fff7d9;font-size:clamp(23px,6vw,32px);font-weight:800;overflow-wrap:anywhere;margin:10px 0 16px;text-shadow:0 2px 15px rgba(236,187,95,.35);}
    .idc-result-meta {font-size:12px;line-height:1.8;color:#d8c8d9;overflow-wrap:anywhere;}
    .idc-result-note {margin-top:14px;padding:11px;border-radius:12px;background:#e5ba6521;color:#f8d889;font-weight:800;line-height:1.5;}
    .idc-result-mode {margin-top:13px;font-size:11px;color:#d6c5e2;letter-spacing:.6px;}
    .idc-result-duplicate {border-color:#e6b25d !important;}
    .idc-result-error {border-color:#f18b9d !important;}
    #idcRetryButton {font-family:'Cinzel',Georgia,serif !important;letter-spacing:.5px;border-radius:30px !important;background:linear-gradient(120deg,#fce39a,#d99b3e) !important;box-shadow:0 8px 20px #0005;}


    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      min-height: 100vh;

      font-family:
        Arial,
        sans-serif;

      color: white;

      text-align: center;

      background:
        radial-gradient(
          circle at top,
          #762467 0%,
          #3b1245 42%,
          #17091e 100%
        );

    }


    .screen {

      min-height: 100vh;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      padding: 32px 20px;

    }


    .hidden {

      display: none !important;

    }


    .diya {

      font-size: 52px;

      margin-bottom: 15px;

    }


    .present {

      color: #f3d78a;

      font-size: 12px;

      font-weight: 800;

      letter-spacing: 3px;

      margin-bottom: 17px;

    }


    .title {

      margin: 0;

      color: #fff4cf;

      font-size: 39px;

      line-height: 1.05;

      font-weight: 900;

    }


    .year {

      color: #e9b84e;

      font-size: 31px;

      font-weight: 900;

      margin-top: 6px;

    }


    .tagline {

      color: #efdcb4;

      font-size: 16px;

      letter-spacing: 1px;

      margin-top: 18px;

    }


    .line {

      width: 90px;

      height: 2px;

      margin: 30px auto;

      background: #d7aa4d;

    }


    .button {

      width: 100%;

      max-width: 340px;

      min-height: 58px;

      border: 0;

      border-radius: 40px;

      background:
        linear-gradient(
          135deg,
          #f8db7e,
          #d69a30
        );

      color: #32103b;

      font-size: 19px;

      font-weight: 900;

      letter-spacing: 1px;

      cursor: pointer;

      box-shadow:
        0 10px 30px
        rgba(0, 0, 0, .30);

    }


    .button:active {

      transform: scale(.98);

    }


    .date {

      margin-top: 27px;

      color: #d7c4d5;

      font-size: 13px;

    }


    /* ==========================================
       CAMERA SCREEN
    ========================================== */


    .scanner-title {

      color: #f3d78a;

      font-size: 14px;

      font-weight: 800;

      letter-spacing: 2px;

      margin-bottom: 8px;

    }


    .scanner-heading {

      color: #fff4cf;

      font-size: 27px;

      font-weight: 900;

      margin-bottom: 8px;

    }


    .instruction {

      color: #dac8d8;

      font-size: 14px;

      margin-bottom: 20px;

    }


    #reader {

      width: 100%;

      max-width: 420px;

      border-radius: 24px;

      overflow: hidden;

      background: #000;

    }


    #reader video {

      border-radius: 24px;

    }


    .scanning {

      margin-top: 18px;

      color: #f3d78a;

      font-size: 14px;

    }


    .error {

      width: 100%;

      max-width: 400px;

      margin-top: 20px;

      padding: 15px;

      border-radius: 15px;

      background:
        rgba(
          255,
          90,
          90,
          .15
        );

      color: #ffaaaa;

      font-size: 14px;

      line-height: 1.5;

    }


    .cancel {

      margin-top: 22px;

      border: 1px solid
        rgba(
          255,
          255,
          255,
          .35
        );

      border-radius: 30px;

      padding: 12px 25px;

      background: transparent;

      color: white;

      font-size: 14px;

      cursor: pointer;

    }


    .verifying {

      font-size: 20px;

      color: #f4d783;

      font-weight: bold;

      margin-top: 25px;

    }

  </style>

</head>



<body>


<!-- ======================================================
     WELCOME SCREEN
====================================================== -->

<div
  id="welcomeScreen"
  class="screen"
>

  <div class="diya">
    🪔
  </div>


  <div class="present">

    INDIAN DANCE CREW PRESENTS

  </div>


  <h1 class="title">

    IDC RAASVERSE
    <br>
    2.0

  </h1>


  <div class="year">

    2026

  </div>


  <div class="tagline">

    ONE LAST RAAS. ONE EPIC FINALE.

  </div>


  <div class="line"></div>


  <button
    id="scanButton"
    class="button"
  >

    SCAN PASS

  </button>


  <div class="date">

    25 OCTOBER 2026
    &nbsp; • &nbsp;
    TOKYO

  </div>

</div>



<!-- ======================================================
     CAMERA SCREEN
====================================================== -->

<div
  id="scannerScreen"
  class="screen hidden"
>

  <div class="scanner-title">

    IDC RAASVERSE 2.0 — SHARAD PURNIMA SPECIAL

  </div>


  <div class="scanner-heading">

    SCAN ENTRY PASS

  </div>


  <div class="instruction">

    Place the participant's QR code inside the frame

  </div>


  <div id="reader"></div>


  <div
    id="scanningMessage"
    class="scanning"
  >

    Looking for QR code...

  </div>


  <div
    id="verifyMessage"
    class="verifying hidden"
  >

    ✨ Verifying pass...

  </div>


  <div
    id="cameraError"
    class="error hidden"
  >
  </div>


  <button
    id="cancelButton"
    class="cancel"
    type="button"
  >

    CANCEL

  </button>

</div>



<script
  src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
</script>



<script>

  // ======================================================
  // IMPORTANT:
  // IMPORTANT: Set this to the NEW RAASVERSE 2.0 Apps Script /exec URL. Never use the old event URL.
  // ======================================================

  const APPS_SCRIPT_URL =
    'https://script.google.com/macros/s/AKfycbzKpcjtDtmo75CPtmWKxTkSQkw-gWdKc7fAlBUR8ru6lYBxh3MPBKknnTBJl9CKACtA/exec';



  let scanner = null;

  let scanLocked = false;



  const welcomeScreen =
    document.getElementById(
      'welcomeScreen'
    );


  const scannerScreen =
    document.getElementById(
      'scannerScreen'
    );


  const scanButton =
    document.getElementById(
      'scanButton'
    );


  const cancelButton =
    document.getElementById(
      'cancelButton'
    );


  const cameraError =
    document.getElementById(
      'cameraError'
    );


  const scanningMessage =
    document.getElementById(
      'scanningMessage'
    );


  const verifyMessage =
    document.getElementById(
      'verifyMessage'
    );



  // Keep validation and its result on the same mobile page.
  const resultPanel = document.createElement('div');
  resultPanel.id = 'idcResultPanel';
  resultPanel.setAttribute('role','status');
  resultPanel.setAttribute('aria-live','polite');
  resultPanel.style.display = 'none';
  scannerScreen.appendChild(resultPanel);
  const retryButton = document.createElement('button');
  retryButton.id = 'idcRetryButton';
  retryButton.type = 'button';
  retryButton.textContent = '✦ SCAN ANOTHER PASS ✦';
  retryButton.style.cssText = 'display:none;margin:12px auto;padding:15px 24px;color:#23112b;border:0;font-weight:800;cursor:pointer';
  scannerScreen.appendChild(retryButton);
  retryButton.addEventListener('click', async () => {
    resultPanel.style.display = 'none';
    retryButton.style.display = 'none';
    scanLocked = false;
    await startScanner();
  });

  function showIDCResult(result, liveMode) {
    verifyMessage.classList.add('hidden');
    cameraError.classList.add('hidden');
    resultPanel.style.display = 'block';
    retryButton.style.display = 'block';
    const status = String(result?.status || 'ERROR').toUpperCase();
    const msg = String(result?.message || '');
    const duplicate = /ALREADY|DUPLICATE|CHECKED.IN/i.test(status) || /already checked.in|already used|previously checked.in/i.test(msg);
    const good = result?.success === true && !duplicate;
    const successLive = good && liveMode;
    resultPanel.className = duplicate ? 'idc-result-duplicate' : (good ? '' : 'idc-result-error');
    let heading, icon, note;
    if (duplicate) {
      heading = 'THIS PASS HAS ALREADY ENTERED';
      icon = '🌙';
      note = '✨ One pass, one entry — keep the Garba magic fair for everyone!';
    } else if (successLive) {
      heading = 'WELCOME TO RAASVERSE 2.0!';
      icon = '🪔';
      note = '💃✨ Go rock the Garba floor — let your joy shine under the Sharad Purnima moon! 🌙';
    } else if (good) {
      heading = 'PASS VERIFIED!';
      icon = '✨';
      note = '🪔 Ready for the Raas! Go rock the Garba floor when you check in!';
    } else {
      heading = 'PASS NEEDS ATTENTION';
      icon = '⚠️';
      note = 'Please ask the IDC welcome desk for assistance. 🪔';
    }
    resultPanel.replaceChildren();
    const add = (className, value) => {
      const el = document.createElement('div');
      el.className = className;
      el.textContent = value;
      resultPanel.appendChild(el);
    };
    add('idc-result-kicker', '✦ INDIAN DANCE CREW · SHARAD PURNIMA ✦');
    add('idc-result-icon', icon);
    add('idc-result-title', heading);
    // Show the verified participant name prominently on success, preview and duplicate scans.
    const verifiedName = String(result?.participantName || '').trim();
    if (verifiedName) {
      add('idc-result-meta', '✦ PARTICIPANT ✦');
      add('idc-result-name', verifiedName);
    }
    if (duplicate) add('idc-result-message', 'This ticket has already been checked in. Please contact the IDC welcome desk if you need help.');
    else if (msg && !good) add('idc-result-message', msg);
    else if (good) add('idc-result-message', successLive ? 'Your entry is confirmed. Let the celebration begin!' : 'Your ticket is valid and ready for event-day entry.');
    add('idc-result-note', note);
    if (!liveMode) add('idc-result-mode', '🔎 PREVIEW ONLY · No check-in recorded');
    else if (!good) add('idc-result-mode', 'NO NEW CHECK-IN RECORDED');
  }

  function requestIDCResult(qr, mode) {
    return new Promise((resolve, reject) => {
      const callbackName = 'idcQRCallback_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
      const tag = document.createElement('script');
      let settled = false;
      const cleanup = () => {
        delete window[callbackName];
        tag.remove();
        clearTimeout(timeout);
      };
      window[callbackName] = (response) => {
        if (settled) return;
        settled = true;
        cleanup();
        resolve(response);
      };
      tag.onerror = () => {
        if (settled) return;
        settled = true;
        cleanup();
        reject(new Error('The script could not load.'));
      };
      const timeout = setTimeout(() => {
        if (settled) return;
        settled = true;
        cleanup();
        reject(new Error('Server response was not received. The check-in MAY have been recorded. Check column Q before scanning again.'));
      }, 45000);
      tag.src = APPS_SCRIPT_URL + '?mode=' + encodeURIComponent(mode) + '&qr=' + encodeURIComponent(qr) + '&callback=' + encodeURIComponent(callbackName);
      document.body.appendChild(tag);
    });
  }

  // ======================================================
  // SCAN BUTTON
  // ======================================================

  scanButton.addEventListener(
    'click',
    startScanner
  );



  // ======================================================
  // CANCEL BUTTON
  // ======================================================

  cancelButton.addEventListener(
    'click',
    async function() {

      await stopScanner();

      scannerScreen
        .classList
        .add('hidden');

      welcomeScreen
        .classList
        .remove('hidden');

    }
  );



  // ======================================================
  // START CAMERA
  // ======================================================

  async function startScanner() {

    if (!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(APPS_SCRIPT_URL)) {
      alert('Scanner setup incomplete: add the NEW RAASVERSE 2.0 Apps Script deployment URL in index.html first.');
      return;
    }

    scanLocked = false;


    cameraError
      .classList
      .add('hidden');


    verifyMessage
      .classList
      .add('hidden');


    scanningMessage
      .classList
      .remove('hidden');


    welcomeScreen
      .classList
      .add('hidden');


    scannerScreen
      .classList
      .remove('hidden');


    try {


      scanner =
        new Html5Qrcode(
          'reader'
        );


      const cameras =
        await Html5Qrcode
          .getCameras();


      if (
        !cameras ||
        cameras.length === 0
      ) {

        throw new Error(
          'No camera was found on this device.'
        );

      }


      let selectedCamera =
        cameras[0].id;


      // Prefer rear camera

      for (
        let i = 0;
        i < cameras.length;
        i++
      ) {

        const label =
          String(
            cameras[i].label || ''
          )
          .toLowerCase();


        if (
          label.includes('back') ||
          label.includes('rear') ||
          label.includes('environment')
        ) {

          selectedCamera =
            cameras[i].id;

          break;

        }

      }


      const config = {

        fps: 12,

        qrbox: function(
          viewfinderWidth,
          viewfinderHeight
        ) {

          const size =
            Math.floor(
              Math.min(
                viewfinderWidth,
                viewfinderHeight
              ) * .72
            );


          return {

            width: size,

            height: size

          };

        },

        aspectRatio:
          1.0

      };


      await scanner.start(

        selectedCamera,

        config,

        onScanSuccess,

        function() {
          // Normal frame-by-frame
          // QR detection failures ignored.
        }

      );


    }
    catch (error) {


      console.error(
        error
      );


      cameraError
        .textContent =
        'Camera could not be opened. Please allow camera access in your browser settings and try again.';


      cameraError
        .classList
        .remove('hidden');


      scanningMessage
        .classList
        .add('hidden');

    }

  }



  // ======================================================
  // QR SUCCESS
  // ======================================================

  async function onScanSuccess(
    decodedText
  ) {


    if (scanLocked) {
      return;
    }


    scanLocked = true;


    scanningMessage
      .classList
      .add('hidden');


    verifyMessage
      .classList
      .remove('hidden');


    // Keep the camera from decoding more frames while the first request is pending.
    // Do not wait for camera shutdown before contacting the backend.
    const cameraShutdown = stopScanner();


    // ----------------------------------------------------
    // BASIC IDC QR CHECK
    // Avoid sending random QR codes to backend
    // ----------------------------------------------------

    const qrValue =
      String(
        decodedText || ''
      ).trim();


    if (
      !qrValue.startsWith(
        'IDC2-2026|'
      )
    ) {


      cameraError
        .textContent =
        '⚠️ This is not a RAASVERSE 2.0 entry pass.';


      cameraError
        .classList
        .remove('hidden');


      verifyMessage
        .classList
        .add('hidden');


      scanLocked = false;


      setTimeout(
        startScanner,
        1800
      );


      return;

    }


    // Query the backend without navigating away from this scanner.
    // Apps Script supports JSONP via the callback parameter in File 3.
    const liveMode = new URLSearchParams(window.location.search).get('live') === '1';
    const mode = liveMode ? 'checkin' : 'preview';
    try {
      const result = await requestIDCResult(qrValue, mode);
      showIDCResult(result, liveMode);
    } catch (error) {
      showIDCResult({success:false,status:'CONNECTION_ERROR',message:
        'Could not contact the RAASVERSE 2.0 backend. Check Web App deployment access (Anyone), deployment version, and IDC2_SPREADSHEET_ID. ' + error.message}, liveMode);
    }

  }



  // ======================================================
  // STOP CAMERA
  // ======================================================

  async function stopScanner() {


    if (!scanner) {
      return;
    }


    try {


      const state =
        scanner.getState();


      if (
        state ===
        Html5QrcodeScannerState.SCANNING ||
        state ===
        Html5QrcodeScannerState.PAUSED
      ) {

        await scanner.stop();

      }


      scanner.clear();


    }
    catch (error) {

      console.log(
        'Scanner stop:',
        error
      );

    }


    scanner = null;

  }



  // ======================================================
  // WHEN RETURNING FROM RESULT PAGE
  // ======================================================

  window.addEventListener(
    'pageshow',
    function() {


      if (verifyMessage.classList.contains('hidden')) scanLocked = false;


      verifyMessage
        .classList
        .add('hidden');


      scannerScreen
        .classList
        .add('hidden');


      welcomeScreen
        .classList
        .remove('hidden');

    }
  );


</script>


</body>

</html>
