<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1"
  >

  <title>
    IDC RAASVERSE 2.0 — Sharad Purnima Scanner
  </title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      min-height: 100vh;

      font-family:
        Arial,
        sans-serif;

      color: white;

      text-align: center;

      background:
        radial-gradient(
          circle at top,
          #762467 0%,
          #3b1245 42%,
          #17091e 100%
        );

    }


    .screen {

      min-height: 100vh;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      padding: 32px 20px;

    }


    .hidden {

      display: none !important;

    }


    .diya {

      font-size: 52px;

      margin-bottom: 15px;

    }


    .present {

      color: #f3d78a;

      font-size: 12px;

      font-weight: 800;

      letter-spacing: 3px;

      margin-bottom: 17px;

    }


    .title {

      margin: 0;

      color: #fff4cf;

      font-size: 39px;

      line-height: 1.05;

      font-weight: 900;

    }


    .year {

      color: #e9b84e;

      font-size: 31px;

      font-weight: 900;

      margin-top: 6px;

    }


    .tagline {

      color: #efdcb4;

      font-size: 16px;

      letter-spacing: 1px;

      margin-top: 18px;

    }


    .line {

      width: 90px;

      height: 2px;

      margin: 30px auto;

      background: #d7aa4d;

    }


    .button {

      width: 100%;

      max-width: 340px;

      min-height: 58px;

      border: 0;

      border-radius: 40px;

      background:
        linear-gradient(
          135deg,
          #f8db7e,
          #d69a30
        );

      color: #32103b;

      font-size: 19px;

      font-weight: 900;

      letter-spacing: 1px;

      cursor: pointer;

      box-shadow:
        0 10px 30px
        rgba(0, 0, 0, .30);

    }


    .button:active {

      transform: scale(.98);

    }


    .date {

      margin-top: 27px;

      color: #d7c4d5;

      font-size: 13px;

    }


    /* ==========================================
       CAMERA SCREEN
    ========================================== */


    .scanner-title {

      color: #f3d78a;

      font-size: 14px;

      font-weight: 800;

      letter-spacing: 2px;

      margin-bottom: 8px;

    }


    .scanner-heading {

      color: #fff4cf;

      font-size: 27px;

      font-weight: 900;

      margin-bottom: 8px;

    }


    .instruction {

      color: #dac8d8;

      font-size: 14px;

      margin-bottom: 20px;

    }


    #reader {

      width: 100%;

      max-width: 420px;

      border-radius: 24px;

      overflow: hidden;

      background: #000;

    }


    #reader video {

      border-radius: 24px;

    }


    .scanning {

      margin-top: 18px;

      color: #f3d78a;

      font-size: 14px;

    }


    .error {

      width: 100%;

      max-width: 400px;

      margin-top: 20px;

      padding: 15px;

      border-radius: 15px;

      background:
        rgba(
          255,
          90,
          90,
          .15
        );

      color: #ffaaaa;

      font-size: 14px;

      line-height: 1.5;

    }


    .cancel {

      margin-top: 22px;

      border: 1px solid
        rgba(
          255,
          255,
          255,
          .35
        );

      border-radius: 30px;

      padding: 12px 25px;

      background: transparent;

      color: white;

      font-size: 14px;

      cursor: pointer;

    }


    .verifying {

      font-size: 20px;

      color: #f4d783;

      font-weight: bold;

      margin-top: 25px;

    }

  </style>

</head>



<body>


<!-- ======================================================
     WELCOME SCREEN
====================================================== -->

<div
  id="welcomeScreen"
  class="screen"
>

  <div class="diya">
    🪔
  </div>


  <div class="present">

    INDIAN DANCE CREW PRESENTS

  </div>


  <h1 class="title">

    IDC RAASVERSE
    <br>
    2.0

  </h1>


  <div class="year">

    2026

  </div>


  <div class="tagline">

    ONE LAST RAAS. ONE EPIC FINALE.

  </div>


  <div class="line"></div>


  <button
    id="scanButton"
    class="button"
  >

    SCAN PASS

  </button>


  <div class="date">

    25 OCTOBER 2026
    &nbsp; • &nbsp;
    TOKYO

  </div>

</div>



<!-- ======================================================
     CAMERA SCREEN
====================================================== -->

<div
  id="scannerScreen"
  class="screen hidden"
>

  <div class="scanner-title">

    IDC RAASVERSE 2.0 — SHARAD PURNIMA SPECIAL

  </div>


  <div class="scanner-heading">

    SCAN ENTRY PASS

  </div>


  <div class="instruction">

    Place the participant's QR code inside the frame

  </div>


  <div id="reader"></div>


  <div
    id="scanningMessage"
    class="scanning"
  >

    Looking for QR code...

  </div>


  <div
    id="verifyMessage"
    class="verifying hidden"
  >

    ✨ Verifying pass...

  </div>


  <div
    id="cameraError"
    class="error hidden"
  >
  </div>


  <button
    id="cancelButton"
    class="cancel"
    type="button"
  >

    CANCEL

  </button>

</div>



<script
  src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
</script>



<script>

  // ======================================================
  // IMPORTANT:
  // IMPORTANT: Set this to the NEW RAASVERSE 2.0 Apps Script /exec URL. Never use the old event URL.
  // ======================================================

  const APPS_SCRIPT_URL =
    'https://script.google.com/macros/s/AKfycbzKpcjtDtmo75CPtmWKxTkSQkw-gWdKc7fAlBUR8ru6lYBxh3MPBKknnTBJl9CKACtA/exec';



  let scanner = null;

  let scanLocked = false;



  const welcomeScreen =
    document.getElementById(
      'welcomeScreen'
    );


  const scannerScreen =
    document.getElementById(
      'scannerScreen'
    );


  const scanButton =
    document.getElementById(
      'scanButton'
    );


  const cancelButton =
    document.getElementById(
      'cancelButton'
    );


  const cameraError =
    document.getElementById(
      'cameraError'
    );


  const scanningMessage =
    document.getElementById(
      'scanningMessage'
    );


  const verifyMessage =
    document.getElementById(
      'verifyMessage'
    );



  // ======================================================
  // SCAN BUTTON
  // ======================================================

  scanButton.addEventListener(
    'click',
    startScanner
  );



  // ======================================================
  // CANCEL BUTTON
  // ======================================================

  cancelButton.addEventListener(
    'click',
    async function() {

      await stopScanner();

      scannerScreen
        .classList
        .add('hidden');

      welcomeScreen
        .classList
        .remove('hidden');

    }
  );



  // ======================================================
  // START CAMERA
  // ======================================================

  async function startScanner() {

    if (!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(APPS_SCRIPT_URL)) {
      alert('Scanner setup incomplete: add the NEW RAASVERSE 2.0 Apps Script deployment URL in index.html first.');
      return;
    }

    scanLocked = false;


    cameraError
      .classList
      .add('hidden');


    verifyMessage
      .classList
      .add('hidden');


    scanningMessage
      .classList
      .remove('hidden');


    welcomeScreen
      .classList
      .add('hidden');


    scannerScreen
      .classList
      .remove('hidden');


    try {


      scanner =
        new Html5Qrcode(
          'reader'
        );


      const cameras =
        await Html5Qrcode
          .getCameras();


      if (
        !cameras ||
        cameras.length === 0
      ) {

        throw new Error(
          'No camera was found on this device.'
        );

      }


      let selectedCamera =
        cameras[0].id;


      // Prefer rear camera

      for (
        let i = 0;
        i < cameras.length;
        i++
      ) {

        const label =
          String(
            cameras[i].label || ''
          )
          .toLowerCase();


        if (
          label.includes('back') ||
          label.includes('rear') ||
          label.includes('environment')
        ) {

          selectedCamera =
            cameras[i].id;

          break;

        }

      }


      const config = {

        fps: 12,

        qrbox: function(
          viewfinderWidth,
          viewfinderHeight
        ) {

          const size =
            Math.floor(
              Math.min(
                viewfinderWidth,
                viewfinderHeight
              ) * .72
            );


          return {

            width: size,

            height: size

          };

        },

        aspectRatio:
          1.0

      };


      await scanner.start(

        selectedCamera,

        config,

        onScanSuccess,

        function() {
          // Normal frame-by-frame
          // QR detection failures ignored.
        }

      );


    }
    catch (error) {


      console.error(
        error
      );


      cameraError
        .textContent =
        'Camera could not be opened. Please allow camera access in your browser settings and try again.';


      cameraError
        .classList
        .remove('hidden');


      scanningMessage
        .classList
        .add('hidden');

    }

  }



  // ======================================================
  // QR SUCCESS
  // ======================================================

  async function onScanSuccess(
    decodedText
  ) {


    if (scanLocked) {
      return;
    }


    scanLocked = true;


    scanningMessage
      .classList
      .add('hidden');


    verifyMessage
      .classList
      .remove('hidden');


    await stopScanner();


    // ----------------------------------------------------
    // BASIC IDC QR CHECK
    // Avoid sending random QR codes to backend
    // ----------------------------------------------------

    const qrValue =
      String(
        decodedText || ''
      ).trim();


    if (
      !qrValue.startsWith(
        'IDC2-2026|'
      )
    ) {


      cameraError
        .textContent =
        '⚠️ This is not a RAASVERSE 2.0 entry pass.';


      cameraError
        .classList
        .remove('hidden');


      verifyMessage
        .classList
        .add('hidden');


      scanLocked = false;


      setTimeout(
        startScanner,
        1800
      );


      return;

    }


    // ----------------------------------------------------
    // SEND QR TO YOUR EXISTING APPS SCRIPT BACKEND
    // ----------------------------------------------------

    const destination =
      APPS_SCRIPT_URL +
      (new URLSearchParams(window.location.search).get('live') === '1' ? '?mode=checkin&qr=' : '?mode=preview&qr=') +
      encodeURIComponent(
        qrValue
      );


    window.location.href =
      destination;

  }



  // ======================================================
  // STOP CAMERA
  // ======================================================

  async function stopScanner() {


    if (!scanner) {
      return;
    }


    try {


      const state =
        scanner.getState();


      if (
        state ===
        Html5QrcodeScannerState.SCANNING ||
        state ===
        Html5QrcodeScannerState.PAUSED
      ) {

        await scanner.stop();

      }


      scanner.clear();


    }
    catch (error) {

      console.log(
        'Scanner stop:',
        error
      );

    }


    scanner = null;

  }



  // ======================================================
  // WHEN RETURNING FROM RESULT PAGE
  // ======================================================

  window.addEventListener(
    'pageshow',
    function() {


      scanLocked = false;


      verifyMessage
        .classList
        .add('hidden');


      scannerScreen
        .classList
        .add('hidden');


      welcomeScreen
        .classList
        .remove('hidden');

    }
  );


</script>


</body>

</html>
